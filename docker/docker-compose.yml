version: '3.8'

services:
  yii2:
    build: .
    image: yii2-app
    networks:
      - webnet
    deploy:
      replicas: 1
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.yii2.rule=Host(`yii2.local`)"
      - "traefik.http.services.yii2.loadbalancer.server.port=80"

  traefik:
    image: traefik:v2.5
    command:
      - "--api.insecure=true"
      - "--providers.docker.swarmMode=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - webnet
    deploy:
      placement:
        constraints:
          - node.role == manager

networks:
  webnet:
    driver: overlay

